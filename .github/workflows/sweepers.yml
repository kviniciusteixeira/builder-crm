# Varreduras de recuperação. SÓ fazem falta se você implantar na Vercel.
#
# No Coolify as varreduras rodam dentro do processo (`src/lib/barridos.ts`), então este
# workflow não tem nada a fazer: vem com o cron DESLIGADO. Se ficasse ligado,
# cada clone do repositório falharia a cada meia hora para sempre (sem segredos, o curl não
# tem para onde ir), encheria de e-mails o membro e gastaria 1.440 minutos de Actions
# por mês à toa.
#
# Como ligá-lo (só na Vercel):
#  1. Settings -> Secrets and variables -> Actions, e crie
#       APP_BASE_URL         (ex. https://crm.cliente.com)
#       AGENT_WORKER_SECRET  (o mesmo valor que na Vercel)
#  2. Descomente o bloco `schedule` abaixo.
#
# Por que não vão no vercel.json: o plano Hobby só admite crons UMA VEZ POR DIA, e uma
# expressão mais frequente faz o deploy falhar. Os crons do vercel.json ficam como
# reserva diária; o ritmo real é este workflow.
#
# Por que 30 minutos e não 10: o Actions cobra por MINUTO ARREDONDADO PARA CIMA por job,
# mesmo que o curl demore 10 segundos. Com 2.000 minutos grátis por mês:
#   a cada 10 min = 4.320 execuções = 4.320 min -> USD 18,56/mês de excesso
#   a cada 30 min = 1.440 execuções = 1.440 min -> USD 0
# Isto é uma rede de segurança, não o caminho normal: uma mensagem que entra é respondida em
# ~7 s pelo webhook. Meia hora de janela sobre uma falha rara não muda nada.
#
# O que varrem:
#  - /api/agent/process   -> jobs do agente que ficaram pendentes (o setTimeout do
#    webhook morreu antes de disparar o worker).
#  - /api/webhooks/zernio -> eventos do Zernio reivindicados mas sem processar. A nova tentativa
#    do Zernio se autodeduplica, então sem esta varredura esses eventos se perdem.
#  - /api/automations/process -> automações enfileiradas.

name: Sweepers

on:
  # schedule:
  #   - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  sweep:
    runs-on: ubuntu-latest
    env:
      BASE: ${{ secrets.APP_BASE_URL }}
      SECRETO: ${{ secrets.AGENT_WORKER_SECRET }}
    steps:
      # Sem segredos não se falha: explica-se e sai. Um workflow vermelho que é vermelho
      # de propósito treina a ignorar os vermelhos de verdade.
      - name: Comprobar configuracion
        id: config
        run: |
          if [ -z "$BASE" ]; then
            echo "Sin APP_BASE_URL configurado: no hay instancia que barrer."
            echo "Normal si despliegas en Coolify (los barridos corren dentro del proceso)."
            echo "listo=false" >> "$GITHUB_OUTPUT"
          else
            echo "listo=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Barrer jobs del agente
        if: steps.config.outputs.listo == 'true'
        run: |
          curl -sS -m 60 -o /dev/null -w "agent/process -> %{http_code}\n" \
            -H "Authorization: Bearer $SECRETO" \
            "$BASE/api/agent/process"

      - name: Barrer eventos de webhook sin procesar
        if: steps.config.outputs.listo == 'true'
        run: |
          curl -sS -m 60 -o /dev/null -w "webhooks/zernio -> %{http_code}\n" \
            -H "Authorization: Bearer $SECRETO" \
            "$BASE/api/webhooks/zernio"

      - name: Barrer automatizaciones pendientes
        if: steps.config.outputs.listo == 'true'
        run: |
          curl -sS -m 60 -o /dev/null -w "automations/process -> %{http_code}\n" \
            -H "Authorization: Bearer $SECRETO" \
            "$BASE/api/automations/process"
