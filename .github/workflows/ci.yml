# CI do Builder CRM: tests + typecheck + lint + build, com módulos apagados e com o
# modelo imobiliário ativo (os dois extremos que um cliente pode implantar).
#
# Não precisa de credenciais, e a falta de DATABASE_URL é de propósito: o build não deve
# precisar da base (no Dockerfile só as NEXT_PUBLIC_* são build args). Se alguém
# consultar a base ao importar um módulo, este workflow detecta. As NEXT_PUBLIC_*
# vão com valores de preenchimento porque o Next as horneia no bundle.

name: CI

on:
  push:
    branches: [main, builder-crm]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        modulos: ["[]", '["propiedades", "visitas"]']
    name: modulos ${{ matrix.modulos }}
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ejemplo.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: anon-de-relleno
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Activar modulos de la matriz
        run: |
          printf '{ "activos": %s }\n' '${{ matrix.modulos }}' > config/modulos.json
          cat config/modulos.json
      - run: npm run test
        if: ${{ !cancelled() }}
      - run: npm run typecheck
        if: ${{ !cancelled() }}
      - run: npm run lint
        if: ${{ !cancelled() }}
      - run: npm run build
        if: ${{ !cancelled() }}
