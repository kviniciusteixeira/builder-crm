# Builder CRM - docker compose (a base de dados e o auth são Supabase, não entram aqui).
#
#   cp .env.example .env   # preencher
#   docker compose up -d --build
#   curl http://localhost:3000/api/health
#
# No Coolify dá para implantar este compose ou diretamente o Dockerfile; nos dois
# casos o Coolify põe o proxy HTTPS na frente. Para um VPS sem Coolify, colocar um reverse
# proxy (Caddy, Traefik, nginx) apontando para a porta 3000.
services:
  app:
    build:
      context: .
      args:
        SOURCE_COMMIT: ${SOURCE_COMMIT:-}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
    image: builder-crm:local
    env_file:
      - .env
    ports:
      - "${PORT:-3000}:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5
